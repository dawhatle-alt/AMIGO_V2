function exportPlan(){const s=getStats();let t=`AMIGO UPGRADE PLAN — AZAMA79\nGenerated: ${new Date().toLocaleString()}\nProgress: ${s.pct}% (${s.dn}/${s.ap})\nBlockers: ${s.bl} | Actions: ${s.wa}\n\n🔒 Links marked 🔒 require BMC Support Central login: https://www.bmc.com/support\n\n`;

const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='amigo-upgrade-plan-AZAMA79.txt';a.click()}

function render(){const s=getStats();const f=st.filter;let h='';

h+=`<div class="filters">`;['all','todo','blockers','warnings'].forEach(k=>{const l=k==='all'?'All':k==='todo'?'To Do':k==='blockers'?`Blockers (${s.bl})`:`Actions (${s.wa})`;h+=`<button class="fbtn ${f===k?'on':''}" onclick="st.filter='${k}';render()">${l}</button>`});

D.forEach(sec=>{let items=sec.items;
if(f==='todo')items=items.filter(i=>i.st==='todo');

else if(f==='warnings')items=items.filter(i=>(i.rk==='warning'||i.rk==='blocker')&&i.st==='todo');
if(!items.length)return;
const dn=sec.items.filter(i=>i.st==='done').length,tot=sec.items.filter(i=>i.st!=='na').length,op=st.expanded[sec.id];

if(op){h+=`<div class="sec-body">`;items.forEach(i=>{const ico=i.st==='done'?'✅':i.st==='na'?'➖':'⬜';const dp=i.rk==='blocker'?'dp-bl':i.rk==='warning'?'dp-wa':'dp-cl';const bd=i.rk==='blocker'?'b-bl':'b-wa';const hd=i.dt||i.cmd||(i.refs&&i.refs.length);const ie=st.ei[i.id];

h+=`</div>`;

if(i.dt)h+=`<div class="dtxt">${esc(i.dt)}</div>`;

if(i.refs&&i.refs.length){h+=`<div class="rh">📖 References</div>`;i.refs.forEach(r=>{h+=`<a class="rl" href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">↗ ${esc(r.l)}</a>`})}
h+=`</div>`}
h+=`</div></div>`});h+=`</div>`}h+=`</div>`});
